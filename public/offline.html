<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maple Search - 離線模式</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --fg: #0f172a;
        --muted: #64748b;
        --card: #ffffff;
        --accent: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 100%);
        background: var(--card);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.6;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      .ghost {
        background: transparent;
        color: var(--accent);
      }
      .note {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>目前為離線模式</h1>
        <p>
          你可以先瀏覽已快取的內容。連線恢復後，回到首頁即可正常使用完整功能。
        </p>
        <div class="actions">
          <button class="btn" onclick="location.reload()">重新整理</button>
          <button class="btn ghost" onclick="location.href='/'">回到首頁</button>
        </div>
        <div class="note">提示：首次上線時會自動快取首頁與資源。</div>
      </div>
    </div>
  </body>
</html>
